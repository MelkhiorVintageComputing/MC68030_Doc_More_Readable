<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"
     font-family="'DejaVu Sans',Verdana,Arial,sans-serif" role="img"
     aria-label="M68000 clock input timing diagram: trapezoidal clock waveform with cycle time, low and high pulse widths, and rise and fall times marked against the 2.0 V and 0.8 V thresholds">
  <title>Figure 10-3. Clock Input Timing Diagram — M68000</title>
  <style>
    .wave { stroke:#111; stroke-width:3.2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .cons { stroke:#111; stroke-width:0.9; fill:none; opacity:.55; }
    .tick { stroke:#111; stroke-width:1.6; fill:none; }
    .dim  { stroke:#111; stroke-width:1.4; fill:none; }
    .lbl  { fill:#111; font-size:14px; }
    .num  { fill:#111; font-size:15px; font-weight:700; text-anchor:middle; }
    .disc { stroke:#111; stroke-width:1.5; fill:#fff; }
    .ah   { fill:#111; }
    @media (prefers-color-scheme: dark) {
      .wave,.cons,.tick,.dim { stroke:#e8e8e8; }
      .lbl,.num { fill:#e8e8e8; }
      .disc { stroke:#e8e8e8; fill:#161616; }
      .ah { fill:#e8e8e8; }
    }
  </style>
  <!-- Arrowheads are explicit polygons rather than <marker> elements: several
       SVG rasterisers used by documentation tools ignore markers entirely. -->

  <!-- construction lines (drawn first, so the waveform sits on top) -->
  <g class="cons">
    <line x1="100" y1="266" x2="100" y2="372"/>
    <line x1="130" y1="194" x2="130" y2="372"/>
    <line x1="270" y1="194" x2="270" y2="52"/>
    <line x1="270" y1="194" x2="270" y2="404"/>
    <line x1="300" y1="266" x2="300" y2="404"/>
    <line x1="300" y1="266" x2="300" y2="104"/>
    <line x1="450" y1="266" x2="450" y2="104"/>
    <line x1="480" y1="194" x2="480" y2="104"/>
    <line x1="620" y1="194" x2="620" y2="52"/>
  </g>

  <!-- threshold reference ticks on every measured crossing -->
  <g class="tick">
    <line x1="93"  y1="266" x2="107" y2="266"/>
    <line x1="123" y1="194" x2="137" y2="194"/>
    <line x1="263" y1="194" x2="277" y2="194"/>
    <line x1="293" y1="266" x2="307" y2="266"/>
    <line x1="443" y1="266" x2="457" y2="266"/>
    <line x1="473" y1="194" x2="487" y2="194"/>
    <line x1="613" y1="194" x2="627" y2="194"/>
    <line x1="643" y1="266" x2="657" y2="266"/>
    <line x1="60"  y1="194" x2="76"  y2="194"/>
    <line x1="60"  y1="266" x2="76"  y2="266"/>
  </g>

  <!-- clock waveform: low, rise, high, fall, low, rise, high, fall, low -->
  <path class="wave" d="M 20,290 L 90,290 L 140,170 L 260,170 L 310,290
                        L 440,290 L 490,170 L 610,170 L 660,290 L 740,290"/>

  <!-- voltage level labels -->
  <text class="lbl" x="55" y="199" text-anchor="end">2.0 V</text>
  <text class="lbl" x="55" y="271" text-anchor="end">0.8 V</text>
  <text class="lbl" x="20" y="330" font-size="13" font-weight="700">CLK</text>

  <!-- 1 : cycle time, 2.0 V falling edge to 2.0 V falling edge -->
  <line class="dim" x1="270" y1="60" x2="620" y2="60"/>
  <path class="ah" d="M270,60 L279,55.5 L279,64.5 Z"/>
  <path class="ah" d="M620,60 L611,55.5 L611,64.5 Z"/>
  <circle class="disc" cx="445" cy="60" r="15"/>
  <text class="num" x="445" y="65">1</text>

  <!-- 2 : clock low width, measured 0.8 V to 0.8 V -->
  <line class="dim" x1="300" y1="112" x2="450" y2="112"/>
  <path class="ah" d="M300,112 L309,107.5 L309,116.5 Z"/>
  <path class="ah" d="M450,112 L441,107.5 L441,116.5 Z"/>
  <circle class="disc" cx="375" cy="112" r="15"/>
  <text class="num" x="375" y="117">2</text>

  <!-- 3 : clock high width, measured 2.0 V to 2.0 V -->
  <line class="dim" x1="480" y1="112" x2="620" y2="112"/>
  <path class="ah" d="M480,112 L489,107.5 L489,116.5 Z"/>
  <path class="ah" d="M620,112 L611,107.5 L611,116.5 Z"/>
  <circle class="disc" cx="550" cy="112" r="15"/>
  <text class="num" x="550" y="117">3</text>

  <!-- 4 : rise time, 0.8 V to 2.0 V (arrows approach from outside) -->
  <line class="dim" x1="55"  y1="372" x2="100" y2="372"/>
  <path class="ah" d="M100,372 L91,367.5 L91,376.5 Z"/>
  <line class="dim" x1="190" y1="372" x2="130" y2="372"/>
  <path class="ah" d="M130,372 L139,367.5 L139,376.5 Z"/>
  <circle class="disc" cx="205" cy="372" r="15"/>
  <text class="num" x="205" y="377">4</text>

  <!-- 5 : fall time, 2.0 V to 0.8 V -->
  <line class="dim" x1="225" y1="404" x2="270" y2="404"/>
  <path class="ah" d="M270,404 L261,399.5 L261,408.5 Z"/>
  <line class="dim" x1="360" y1="404" x2="300" y2="404"/>
  <path class="ah" d="M300,404 L309,399.5 L309,408.5 Z"/>
  <circle class="disc" cx="375" cy="404" r="15"/>
  <text class="num" x="375" y="409">5</text>
</svg>
